<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartGrade – Academic Monitoring & Communication System</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════ LOGIN PAGE ═══════════════ -->
<div id="login-page">
  <div class="login-left">
    <div class="hero-deco hero-deco-1"></div>
    <div class="hero-deco hero-deco-2"></div>
    <div class="ll-logo">
      <div class="ll-icon"><img src="images/logo.png" alt="SmartGrade logo"></div>
      <div class="ll-brand smartgrade-gradient">SmartGrade</div>
    </div>
  </div>
  <div class="login-right">
    <div class="login-box">
      <div class="lbox-title">Welcome back!</div>
      <div class="lbox-sub">Sign in to access your SmartGrade dashboard</div>
      <div class="lf">
  <label>Email Address</label>
  <input id="l-email" type="email" value="" placeholder="your@email.com">
</div>

<div class="lf">
  <label>Password</label>
  <div class="pass-wrap">
    <input id="l-pass" type="password" placeholder="Enter your password">
    <button type="button" class="pass-toggle" id="pass-toggle" onclick="togglePasswordVisibility()" aria-label="Show password">
      <i class="fa-solid fa-eye"></i>
    </button>
  </div>
</div>
      <div style="text-align:right;margin-bottom:10px;margin-top:-6px">
  <span onclick="openForgotPassword()"
    style="font-size:12px;color:var(--green);cursor:pointer;font-weight:600">
    Forgot Password?
  </span>
</div>
      <button class="login-cta" onclick="doLogin()">Sign In to SmartGrade →</button>
      <div class="demo-box" id="demo-hint"><strong>Demo Access:</strong><br>Welcome!</div>
    </div>
  </div>
</div>

<!-- ═══════════════ APP SHELL ═══════════════ -->
<div id="app" style="flex-direction:column">
 <div class="topbar">
  <button class="hamburger-btn" onclick="toggleSidebar()" id="hamburger-btn">
    <span></span><span></span><span></span>
  </button>
    <div class="tb-brand"><img class="tb-brand-logo" src="images/logo.png" alt="SmartGrade logo"><span class="tb-brand-text">SmartGrade</span></div>
    <button class="tb-notif-btn" onclick="openNotifications()" title="Announcements">
      <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      <span class="tb-topbadge" id="notif-badge" style="display:none"></span>
    </button>
    <button class="tb-notif-btn" onclick="nav('messages')" title="Messages">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      <span class="tb-topbadge" id="msg-badge" style="display:none"></span>
    </button>
    <div class="tb-user" onclick="nav('profile')" title="View Profile">
      <div class="av av-32 av-green" id="tb-av">?</div>
      <div class="tb-user-info">
        <div class="tb-uname" id="tb-name">User</div>
        <div class="tb-urole" id="tb-role">role</div>
      </div>
    </div>
    <button class="tb-logout" onclick="doLogout()">Sign Out</button>
  </div>
  <div class="app-body">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="script.js"></script>
</body>
</html>
